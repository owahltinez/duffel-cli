[project]
name = "duffel-cli"
version = "0.1.0"
description = "Search live airline fares from the terminal via the Duffel API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oscar Wahltinez" }]
keywords = ["duffel", "flights", "airfare", "travel", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = ["click>=8.1"]

[project.urls]
Homepage = "https://github.com/owahltinez/duffel-cli"
Repository = "https://github.com/owahltinez/duffel-cli"
Issues = "https://github.com/owahltinez/duffel-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
duffel = "duffel_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duffel_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["I"]
